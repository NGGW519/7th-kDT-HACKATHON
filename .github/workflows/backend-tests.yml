name: 백엔드 테스트

# 백엔드 pytest 를 실제 PostgreSQL(PostGIS + pgvector, docker compose 의 db 서비스)에서 실행한다.
# LLM 은 테스트 안에서 가짜 응답을 쓰므로 API 키가 필요 없다.
on:
  push:
    paths:
      - "HometownON/backend/**"
      - "HometownON/db/**"
      - "Crawling_Haman/Hometown_on.sql"
      - "docker-compose.yml"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "HometownON/backend/**"
      - "HometownON/db/**"
      - "Crawling_Haman/Hometown_on.sql"
      - "docker-compose.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci-test-password
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start PostgreSQL (PostGIS + pgvector)
        run: |
          touch .env   # docker-compose.yml 의 backend 서비스가 .env 를 참조하므로 빈 파일만 만든다
          docker compose up -d --build --wait db

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: HometownON/backend/requirements.txt

      - name: Install dependencies
        run: pip install -r HometownON/backend/requirements.txt pytest

      - name: Run tests
        working-directory: HometownON/backend
        run: pytest
