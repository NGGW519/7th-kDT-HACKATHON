name: LLM 모델 점검 (MonoGPT)

# 설정된 MonoGPT 모델(채팅·대체·임베딩)이 아직 목록에 있고 응답하는지 확인한다. 필요할 때 Actions 탭에서 수동으로 실행한다.
# 기본 채팅 모델이나 임베딩 모델을 쓸 수 없으면 실패로 끝나고, 바꿔 쓸 모델 후보를 결과에 보여 준다.
# - 저장소 Secrets 에 MONOGPT_API_KEY 가 있어야 한다 (모델 목록 조회와 짧은 실제 호출에 사용)
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check MonoGPT models
        env:
          MONOGPT_API_KEY: ${{ secrets.MONOGPT_API_KEY }}
        run: python scripts/check_llm_models.py
