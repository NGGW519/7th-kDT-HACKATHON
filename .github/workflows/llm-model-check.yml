name: LLM 모델 주간 점검 (MonoGPT)

# 설정된 MonoGPT 모델(채팅·대체·임베딩)이 아직 목록에 있고 응답하는지 매주 확인한다.
# 기본 채팅 모델이나 임베딩 모델을 쓸 수 없으면 실패로 끝나고 Discord 로 알린다.
# - 저장소 Secrets 에 MONOGPT_API_KEY 가 있어야 한다 (모델 목록 조회와 짧은 실제 호출에 사용)
# - 실패 알림은 저장소 Secrets 의 DISCORD_WEBHOOK_URL 로 보낸다 (없으면 알림만 건너뜀)
on:
  schedule:
    - cron: "0 0 * * 1"  # 매주 월요일 09:00 (KST)
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check MonoGPT models
        env:
          MONOGPT_API_KEY: ${{ secrets.MONOGPT_API_KEY }}
        run: python scripts/check_llm_models.py

      - name: Notify Discord on failure
        if: failure() && env.DISCORD_WEBHOOK_URL != ''
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          JSON=$(jq -n --arg url "$RUN_URL" '{content: ("⚠️ MonoGPT 모델 점검 실패 — 기본 채팅/임베딩 모델을 쓸 수 없습니다. 결과: " + $url)}')
          curl -sS -H "Content-Type: application/json" -X POST -d "$JSON" "$DISCORD_WEBHOOK_URL"
