# 백엔드 + PostgreSQL(PostGIS, pgvector) 실행용 — 저장소 루트에서 실행:  docker compose up -d --build
# 환경 변수는 저장소 루트의 .env 하나에서 읽습니다 (변수 목록은 README 참고).
# 모바일 앱(frontend)은 Expo 로 별도 실행합니다:  cd HometownON/frontend && npx expo start
services:
  backend:
    build:
      context: ./HometownON/backend
    ports:
      - "8000:8000"
    volumes:
      - ./HometownON/backend/app:/app/app  # 개발 중 코드 변경 반영
    env_file:
      - .env
    environment:
      # 컨테이너 내부에서는 서비스 이름으로 접속 (.env 의 localhost 값을 덮어씀)
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    build:
      context: ./HometownON/db
    ports:
      - "5432:5432"
    environment:
      # DB 컨테이너에는 DB 관련 값만 전달 (API 키 등은 넘기지 않음)
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env 에 POSTGRES_PASSWORD 를 설정하세요}
      POSTGRES_DB: ${POSTGRES_DB:-hometown_on}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  pg_data:
